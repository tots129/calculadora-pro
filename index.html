<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3053200125100032"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    
    <!-- MANTENHA SUA METATAG DO ADSENSE AQUI -->
    <meta name="google-adsense-account" content="ca-pub-3053200125100032">
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 0;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            background: #0e1117; 
            color: #fafafa; 
        }
        
        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        
        .credits {
            font-size: 0.9em;
            color: #b0b0b0;
            margin-bottom: 20px;
        }

        .main-title {
            font-size: 2em;
            margin: 10px 0 20px 0;
            font-weight: bold;
            color: #fafafa;
        }

        .card { 
            background: #1a1e26; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        
        input, select { 
            width: 100%; 
            margin-bottom: 20px; 
            padding: 12px; 
            border-radius: 5px; 
            border: 1px solid #363a40; 
            background-color: #0e1117; 
            color: #fafafa; 
            box-sizing: border-box;
            font-size: 1em;
            outline: none;
            /* ANIMAÇÃO DA CAIXA */
            transition: all 0.3s ease-in-out;
            transform-origin: top;
        }

        /* EFEITO AO CLICAR NA CAIXA DE OPERAÇÃO OU NOS NÚMEROS */
        input:focus, select:focus {
            transform: scale(1.02);
            border-color: #007bff;
            box-shadow: 0 0 12px rgba(0, 123, 255, 0.4);
        }
        
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 12px 20px;
            border-radius: 5px; 
            cursor: pointer; 
            font-size: 1.1em;
            width: 100%;
            transition: transform 0.2s, background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }
        
        #resultado { 
            font-weight: bold; 
            text-align: center; 
            font-size: 1.3em; 
            margin-top: 25px;
            padding: 15px;
            border-top: 1px solid #363a40;
            min-height: 1.5em;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8em;
            color: #b0b0b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="credits">
            <p>Créditos ao tots criador e publicador e tudo da calculadora 🧮</p>
            <p>Calculadora em JavaScript super eficaz e rápida.</p>
            <p>Esta é uma ferramenta gratuita desenvolvida em JavaScript para ajudar em cálculos rápidos.</p>
        </div>

        <div class="main-title">
            --- Calculadora JavaScript --- 🧮
        </div>

        <div class="card">
            <label for="operacao">Escolha a operação:</label>
            <select id="operacao">
                <option value="soma">Soma (+)</option>
                <option value="sub">Subtração (-)</option>
                <option value="mult">Multiplicação (*)</option>
                <option value="div">Divisão (/)</option>
            </select>

            <label for="num1">Digite o primeiro número:</label>
            <input type="number" id="num1" placeholder="0,00" step="any">

            <label for="num2">Digite o segundo número:</label>
            <input type="number" id="num2" placeholder="0,00" step="any">

            <button onclick="calcular()">Calcular</button>
            <div id="resultado"></div>
        </div>

        <div class="footer">
            © 2026 - Desenvolvido por Tots | Todos os direitos reservados
        </div>
    </div>

    <script>
        function calcular() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const op = document.getElementById('operacao').value;
            let res = "";

            if (isNaN(n1) || isNaN(n2)) {
                res = "Por favor, digite números válidos.";
            } else {
                if (op === 'soma') res = n1 + n2;
                else if (op === 'sub') res = n1 - n2;
                else if (op === 'mult') res = n1 * n2;
                else if (op === 'div') res = n2 !== 0 ? n1 / n2 : "Erro: Divisão por zero.";
            }

            if (typeof res === 'number') res = Number.isInteger(res) ? res : res.toFixed(2);
            
            // Adiciona uma pequena animação de "fade-in" no resultado
            const elementoResultado = document.getElementById('resultado');
            elementoResultado.style.opacity = 0;
            elementoResultado.innerText = "Resultado: " + res;
            
            setTimeout(() => {
                elementoResultado.style.transition = "opacity 0.5s";
                elementoResultado.style.opacity = 1;
            }, 50);
        }
    </script>
</body>
</html>
